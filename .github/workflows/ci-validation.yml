name: CI and packaging validation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.87.1
        with:
          tool: actionlint@1.7.12,shellcheck@0.11.0
      - name: Validate workflows and embedded shell
        # actionlint 1.7.12 predates the documented concurrency.queue field.
        # Keep this exception specific; all other schema checks remain enabled.
        run: actionlint -color -ignore 'unexpected key "queue" for "concurrency" section'
      - name: Validate packaging shell scripts
        run: shellcheck packaging/linux/*.sh misc/macos/make-app.sh
      - name: Test packaging policies and manifest rendering
        run: python3 -m unittest discover -s packaging -v

  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install repository metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm
      - name: Test signed repository with disposable fixtures
        run: bash packaging/linux/test_repository.sh
