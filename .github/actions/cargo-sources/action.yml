name: Cargo download cache
description: Cache crate archives and Git objects independently of compiler flags
inputs:
  save:
    description: Allow this job to populate the shared download cache
    default: 'false'
runs:
  using: composite
  steps:
    - name: Restore and save source downloads
      id: writer
      if: inputs.save == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-downloads-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-downloads-v1-${{ runner.os }}-
    - name: Restore source downloads without saving another copy
      id: reader
      if: inputs.save != 'true'
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-downloads-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-downloads-v1-${{ runner.os }}-
    - name: Populate downloads for every target in the lockfile
      if: inputs.save == 'true' && steps.writer.outputs.cache-hit != 'true'
      shell: bash
      # Compiler cache setup runs later; fetching must not require its wrapper.
      run: RUSTC_WRAPPER= cargo fetch --locked
    - name: Record source cache result
      shell: bash
      env:
        CACHE_HIT: ${{ steps.writer.outputs.cache-hit || steps.reader.outputs.cache-hit }}
        CACHE_WRITER: ${{ inputs.save }}
      run: |
        printf 'Cargo download cache: exact hit=%s, writer=%s\n' "${CACHE_HIT:-false}" "${CACHE_WRITER}" >> "${GITHUB_STEP_SUMMARY}"
